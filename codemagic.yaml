# Unsigned device build → Spark-unsigned.ipa for Sideloadly (it signs with your Apple ID).
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events: [push]
    scripts:
      - name: Generate project
        script: brew install xcodegen && xcodegen generate
      - name: Build
        script: |
          set -o pipefail
          FORMAT=cat; command -v xcbeautify >/dev/null && FORMAT=xcbeautify
          xcodebuild archive -project Spark.xcodeproj -scheme Spark -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Spark.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | $FORMAT
      - name: Package IPA
        script: |
          set -e
          cd build && mkdir -p Payload
          cp -R Spark.xcarchive/Products/Applications/Spark.app Payload/
          zip -qry Spark-unsigned.ipa Payload && rm -rf Payload
    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients: [keithacker33@gmail.com]
        notify: { success: true, failure: true }
